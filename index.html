
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Student Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>Smart Student Planner</h1>
        <p>Plan your studies. Track your progress. Reach your goals.</p>
    </header>

    <main class="container">
        <section class="summary">
            <div class="summary-card">
                <h3>Total Tasks</h3>
                <p id="totalTasks">0</p>
            </div>
            <div class="summary-card">
                <h3>Completed</h3>
                <p id="completedTasks">0</p>
            </div>
            <div class="summary-card">
                <h3>Pending</h3>
                <p id="pendingTasks">0</p>
            </div>
        </section>

        <section class="task-form">
            <h2>Add a Study Task</h2>

            <form id="taskForm">
                <label for="taskTitle">Task name</label>
                <input type="text" id="taskTitle" placeholder="e.g. Study Mathematics" required>

                <label for="subject">Subject</label>
                <input type="text" id="subject" placeholder="e.g. Mathematics" required>

                <label for="deadline">Deadline</label>
                <input type="date" id="deadline" required>

                <label for="priority">Priority</label>
                <select id="priority">
                    <option value="Low">Low</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="High">High</option>
                </select>

                <button type="submit">+ Add Task</button>
            </form>
        </section>

        <section class="task-section">
            <h2>My Study Tasks</h2>

            <div class="filters">
                <input type="search" id="searchTask" placeholder="Search tasks...">

                <select id="filterStatus">
                    <option value="All">All Tasks</option>
                    <option value="Pending">Pending</option>
                    <option value="Completed">Completed</option>
                </select>
            </div>

            <div id="taskList">
                <p class="empty-message">No tasks yet. Add your first study task!</p>
            </div>
        </section>
    </main>

    <footer>
        <p>Smart Student Planner | Built for better study habits</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
